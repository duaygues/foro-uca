<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>

        <div class="logo">
            UCA Foro
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="carreras.html">Carreras</a>
            <a href="publicar.html">Publicar</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html" class="boton-registro">Registrarse</a>
        </nav>

    </header>

    <h1>Iniciá sesión</h1>

    <!--LOGIN-->

    <fieldset>
    <form action="login", method="post">

        <div class="USUARIO">
            <label for="user">Usuario:</label>
            <input type="email" id="user" name="usuario" placeholder="Usuario o correo UCA" required>
        </div>

        <div class="CONTRASEÑA">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="contraseña" placeholder="Mín. 8 carácteres" required>
        </div>

        <div class="OPCIONES">
            <a href="">¿Te olvidaste tu contraseña o nombre de usuario?</a>
            <p class="red-registro">¿No tenés usuario UCA? <a href="registro.html">Registrate</a> </p>
            <input class="IniSes" type="submit" name="iniciar sesión" value="Iniciar Sesión">
        </div>

    </form>
    </fieldset>

    <!--PIE DE PÁGINA-->
    <footer>

        <p>UCA Foro - Comunidad de estudiantes UCA</p>

    </footer>

</body>

</html>
