<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrate a UCA FORO!</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>

        <div class="logo">
            UCA Foro
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="carreras.html">Carreras</a>
            <a href="publicar.html">Publicar</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html" class="boton-registro">Registrarse</a>
        </nav>

    </header>

    <section class="presentacion">

        <h1>¡Comenzá a conocer a nuevas personas!</h1>

    </section>

    <!--REGISTRO-->

    <fieldset>
    <form id="FORM-REGISTRO" action="index.html", method="GET" novalidate>

        <div class="CORREO-REG">
            <label for="new-user">Ingresar correo de alumno:</label>
            <input type="email" id="new-user" name="nuevo-usuario" placeholder="E-mail o correo UCA" required>
            <small id="ERROR-NEW-USER" class="MENSAJE-ERROR"></small>
        </div>

        <div class="USUARIO-REG">
            <label for="name-user">Nombre de usuario:</label>
            <input type="text" id="name-user" name="nuevo-usuario" placeholder="Nombre de usuario" required>
            <small id="ERROR-NAME-USER" class="MENSAJE-ERROR"></small>
        </div>

        <div class="CONTRASEÑA-REG">
            <label for="new-password">Crear contraseña:</label>
            <input type="password" id="new-password" name="nueva-contraseña" placeholder="Mín. 8 carácteres" required>
            <small id="ERROR-NEWPASSW" class="MENSAJE-ERROR"></small>
        </div>

        <div class="CONTRASEÑA-REG">
            <label for="final-new-password">Confirmar contraseña:</label>
            <input type="password" id="final-new-password" name="nueva-contraseña" placeholder="Mín. 8 carácteres" required>
            <small id="ERROR-FNEWP" class="MENSAJE-ERROR"></small>
        </div>

        <div class="SELCARR">
            <label for="SelCarr">Seleccionar carrera:</label>
            <select name="carr" id="SelCarr">
                <option value="" disabled selected>Seleccionar...</option>
                <option value="">Ing. Agronómica</option>
                <option value="">Ing. Ambiental</option>
                <option value="">Ing. en Alimentos</option>
                <option value="">Ing. Civil</option>
                <option value="">Ing. Industrial</option>
                <option value="">Ing. en Informática</option>
                <option value="">Ing. en Inteligencia Artificial </option>
                <option value="">Ing. Química</option>
                <option value="">Lic. en Biotecnología</option>
                <option value="">Lic. en Cs. de Datos</option>
                <option value="">Arquitectura</option>
                <option value="">Bioingeniería</option>
            </select>
        </div>

        <div class="OPCIONES-REG">
            <p class="red-registro">¿Ya tenés una cuenta? <a href="login.html">Iniciá Sesión</a></p>
            <input class="Reg" type="submit" name="iniciar sesión" value="¡Registrate!">
            <small class="MENSAJE-ERROR" id="ERROR-GENERAL"></small>
        </div>


    </form>
    </fieldset>

    <!--PIE DE PÁGINA-->
    <footer>

        <p>UCA Foro - Comunidad de estudiantes UCA</p>

    </footer>

    <script src="registro.js"></script>

</body>

</html>
