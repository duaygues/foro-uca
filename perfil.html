<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    
    <link rel="stylesheet" href="css/styles.css">
    <script src="Javascript/perfil.js"></script>
</head>
<body>
     <!-- ENCABEZADO -->
    <header>

        <div class="logo">
            UCA Foro
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="carreras.html">Carreras</a>
            <a href="publicar.html">Publicar</a>
            <img src="Def_per.png" alt="foto de perfil" class="fotoperfil_2">
        </nav>

    </header>

     <!-- perfil de usuario -->
    
    <div class="perfil">
        <section class="felx">
            <div class=" foto_perfil">
                <img src="Def_per.png" alt="foto de perfil" class="foto_perfil">
            </div>
            <div class="centrado">
                <input type="text" id="nombre_u" value="nombre del usuario" class="nombreuser" disabled>
                <textarea id= "descripcion_u" class="descuser" disabled ></textarea>
                <button id="editar_perfil" onclick="editarPerfil()">editar perfil</button>
                <button id="silenciar_u" onclick="silenciarUsuario()">Silenciar usuario</button>
            </div>
        </section>

        <section class="publi_prev">
            <div class="centrado">
                <h1> Publicaciones</h1>
            </div>
            <div class="selector_publicaciones">

                <button onclick="mostrarPublicaciones()"> Publicaciones </button>
                <button onclick="mostrarMeGusta()"> Me gusta </button>

            </div>
            <div class="pub_log" id="cont_publi">
                <h2> No se ha subido nada aun</h2>
            </div>
        </section>
    </div>
    
        <!-- PIE -->
    <footer>

        <p>UCA Foro - Comunidad de estudiantes UCA</p>

    </footer>
</body>
</html>
