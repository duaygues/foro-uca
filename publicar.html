<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar en foro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- ENCABEZADO -->
    <header>

        <div class="logo">
            UCA Foro
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="carreras.html">Carreras</a>
            <a href="publicar.html">Publicar</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html" class="boton-registro">Registrarse</a>
        </nav>

    </header>

    <!--PUBLICAR-->

    <section class="presentacion">

        <h1>¡Publicá en el Foro!</h1>

        <p class="aviso">(recordá que lo que subas será visado por un administrador, con el fin de verificar que no se infrijan las normas)</p>

    </section>
    
    <div class="Post-body">

        <div class="SELECT-FORUM">
            <label for="SelectForum"></label>
            <select class="select-foro" name="carr" id="SelectForum" required>
                <option value="" disabled selected>Seleccionar Foro...</option>
                <option value="">Ing. Agronómica</option>
                <option value="">Ing. Ambiental</option>
                <option value="">Ing. en Alimentos</option>
                <option value="">Ing. Civil</option>
                <option value="">Ing. Industrial</option>
                <option value="">Ing. en Informática</option>
                <option value="">Ing. en Inteligencia Artificial </option>
                <option value="">Ing. Química</option>
                <option value="">Lic. en Biotecnología</option>
                <option value="">Lic. en Cs. de Datos</option>
                <option value="">Arquitectura</option>
                <option value="">Bioingeniería</option>
            </select>
        </div>

        <div class="crear-titulo">
            <input class="input-titulo"  type="text" placeholder="Agregar Título" required>
        </div>

        <div class="descripcion">
            <textarea class="texto-descriptivo"  placeholder="Texto de la publicación (opcional)" rows="8"></textarea>
        </div>

        <div class="subir-archivo">
            <label class="boton-adjarch" for="archivo-adjunto">
                <span class="logo-clip">🔗</span> Subir Archivo
            </label>
            <input type="file" id="archivo-adjunto" accept=".pdf,.png,.jpg.doc,.docx">
        </div>

        <div class="guardar-y-publicar">
            <button class="boton-guardar" type="button">Guardar Borrador</button>
            <button class="boton-publicar" type="submit">Publicar</button>
        </div>

    </div>

        <!--PIE DE PÁGINA-->
    <footer>

        <p>UCA Foro - Comunidad de estudiantes UCA</p>

    </footer>
</body>
</html>
